<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #2f5bea;
    --bg: #eef1f6;
    --ink: #14213d;
    --muted: #525f78;
    --line: #c9d1df;
    --link: var(--accent);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --text: "Newsreader", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1526;
      --ink: #e7ebf5;
      --muted: #95a1bb;
      --line: #26314b;
      --link: color-mix(in srgb, var(--accent) 55%, white);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1.125rem/1.65 var(--text);
  }
  a { color: var(--link); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 5vw, 3rem);
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 3rem clamp(2rem, 6vw, 5rem);
  }
  aside {
    align-self: start;
    position: sticky;
    top: clamp(1.5rem, 5vw, 4rem);
  }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    aside { position: static; }
  }

  h1 {
    font: 800 clamp(2.75rem, 7vw, 4.75rem)/0.95 var(--display);
    letter-spacing: -0.035em;
    margin: 0 0 1.25rem;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .role { font: 500 1.25rem/1.3 var(--display); margin: 0 0 0.75rem; }
  .tagline { font-style: italic; color: var(--muted); margin: 0 0 1.75rem; max-width: 30ch; }
  .links { list-style: none; padding: 0; margin: 0; }
  .links li + li { margin-top: 0.15rem; }

  section + section { margin-top: 3.5rem; }
  h2 {
    font: 500 1rem/1.2 var(--display);
    color: var(--muted);
    margin: 0 0 1.25rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--line);
  }
  .about p { margin: 0 0 1rem; max-width: 62ch; white-space: pre-line; }

  .project { padding: 0 0 1.75rem; }
  .project h3 { font: 500 1.4rem/1.25 var(--display); letter-spacing: -0.01em; margin: 0 0 0.35rem; }
  .project p { margin: 0 0 0.5rem; max-width: 60ch; }

  .tags, .skills { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; color: var(--muted); font-size: 1rem; }
  .tags li:not(:last-child)::after,
  .skills li:not(:last-child)::after { content: ",\00a0"; }

  .foot { margin-top: 4rem; color: var(--muted); font-size: 0.95rem; }
  .status { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="status">Loading…</p></div>

<script>
(async function () {
  const app = document.getElementById('app');

  // Tiny DOM helper. Text is always inserted as text, never as HTML.
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      k === 'class' ? (e.className = v) : e.setAttribute(k, v);
    }
    kids.flat().forEach(c => {
      if (c == null || c === false) return;
      e.append(c instanceof Node ? c : document.createTextNode(c));
    });
    return e;
  };
  const safe = u => (/^(https?:\/\/|mailto:)/i.test(u || '') ? u : null);

  let d;
  try {
    const res = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    d = await res.json();
  } catch (err) {
    app.replaceChildren(h('p', { class: 'status' },
      "Couldn't load data.json. If you opened this file straight from your computer, " +
      'run a local server (for example "python -m http.server") or open the GitHub Pages address instead.'));
    return;
  }

  if (/^#[0-9a-f]{6}$/i.test(d.accent || '')) {
    document.documentElement.style.setProperty('--accent', d.accent);
  }
  document.title = [d.name, d.title].filter(Boolean).join(' – ') || 'Portfolio';
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.content = d.tagline || d.title || 'Portfolio';

  const links = [...(d.links || [])];
  if (d.email) links.push({ label: d.email, url: 'mailto:' + d.email });

  const side = h('aside', {},
    h('h1', {}, d.name || 'Your name'),
    d.title ? h('p', { class: 'role' }, d.title) : null,
    d.tagline ? h('p', { class: 'tagline' }, d.tagline) : null,
    links.length ? h('ul', { class: 'links' },
      links.map(l => h('li', {}, h('a', { href: safe(l.url), rel: 'noopener' }, l.label || l.url)))) : null
  );

  const section = (title, cls, ...content) => h('section', { class: cls }, h('h2', {}, title), ...content);

  const paragraphs = (d.about || '').split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  const projects = (d.projects || []).filter(p => p.title);
  const skills = (d.skills || []).filter(Boolean);

  const main = h('main', {},
    paragraphs.length ? section('About', 'about', paragraphs.map(p => h('p', {}, p))) : null,
    projects.length ? section('Projects', 'projects', projects.map(p =>
      h('article', { class: 'project' },
        h('h3', {}, safe(p.url) ? h('a', { href: safe(p.url), rel: 'noopener' }, p.title) : p.title),
        p.description ? h('p', {}, p.description) : null,
        (p.tags || []).length ? h('ul', { class: 'tags' }, p.tags.map(t => h('li', {}, t))) : null
      ))) : null,
    skills.length ? section('Skills', '', h('ul', { class: 'skills' }, skills.map(s => h('li', {}, s)))) : null,
    h('p', { class: 'foot' }, '© ' + new Date().getFullYear() + ' ' + (d.name || ''))
  );

  app.replaceChildren(side, main);
})();
</script>
</body>
</html>
